services:
  baas:
    container_name: baas
    image: baas:dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: dev.dockerfile
    ports:
      - "2200:9000"
      - "2280:8080"
    userns_mode: "host"
    user: ubuntu
    env_file:
      - config/dev-env
    volumes:
      - ../:/home/ubuntu/baas
      - ~/.ssh:/home/ubuntu/.ssh:ro
      - ./config/jupyter:/home/ubuntu/.jupyter
      - ./config/zshrc:/home/ubuntu/.zshrc
    working_dir: "/home/ubuntu"
