# Please ensure the following GitHub repository action secrets are set up:
#  - AWS_ACCESS_KEY_ID
#  - AWS_SECRET_ACCESS_KEY

name: Master Pull Request
run-name: "PR: ${{ github.head_ref }} --> master | ${{ github.actor }}"

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize ]

env:
  repo: "${{ github.event.repository.name }}"
  cli: "bin/${{ github.event.repository.name }}"
  org: "vizcomtech"
  org_url: "github.com"
  docker_registry: "714286101732.dkr.ecr.us-east-2.amazonaws.com/repos/baas"

jobs:
  master-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Change repo permissions
        run: chmod -R o+w ../

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.docker_registry }}

      - name: Pull image
        run: $($cli docker-pull-dev) || echo "docker image not found"

      - name: Build image
        run: $cli docker-build-from-cache

      - name: Start container
        run: $cli docker-start

      - name: Generate docs
        run: $cli docs

      - name: Generate code metrics
        run: $cli docs-metrics

      - name: Generate architecture diagram
        run: $cli docs-architecture

      - name: Lint code
        run: $cli test-lint

      - name: Run tests
        run: $cli test-coverage
